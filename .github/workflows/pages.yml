name: Build and deploy documentation and web game

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish; newer queued pushes replace older queued runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build documentation
        run: make docs
      - name: Build web game
        run: make web
      - name: Include standalone game
        run: cp -R build.nosync/web build.nosync/site/play
      - name: Upload documentation and game
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build.nosync/site

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
